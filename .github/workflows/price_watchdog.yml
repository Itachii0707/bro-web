name: Autonomous Price Scraper & Watchdog

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) at zero cost on GitHub Free Tier
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual 1-click execution from GitHub Actions console

jobs:
  scrape-and-notify:
    name: Scrape Retailers & Dispatch Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Retail Scraper Worker
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/scraper.js

      - name: Evaluate Price Watchdogs & Dispatch Notifications
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/watchdog.js

      - name: Execute 90-Day Postgres Compaction Maintenance
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/compact.js
